<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Backend systems reference architecture</title>
  <desc id="desc">A conceptual backend architecture showing clients, an API gateway, Node and Python services, databases, cache, message broker and background workers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#0B1D35"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D4F88"/><stop offset="1" stop-color="#123A68"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C5668"/><stop offset="1" stop-color="#123C5B"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34306F"/><stop offset="1" stop-color="#202B55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#56C8FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .eyebrow{font:600 15px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#75CFFF}
      .heading{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#F1F7FF}
      .sub{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#A8BDD3}
      .boxTitle{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#F4FAFF}
      .boxSub{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#C1D4E8}
      .tag{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#8DE6FF;letter-spacing:1px}
      .line{fill:none;stroke:#56C8FF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);opacity:.9}
      .dash{fill:none;stroke:#8E9BFF;stroke-width:2.5;stroke-dasharray:8 8;stroke-linecap:round;marker-end:url(#arrow);opacity:.85}
    </style>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <g opacity=".18" stroke="#2D82C0" stroke-width="1">
    <path d="M0 120H1440M0 240H1440M0 360H1440M0 480H1440M0 600H1440"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720M1200 0V720M1320 0V720"/>
  </g>
  <text x="64" y="66" class="eyebrow">SYSTEM DESIGN / REFERENCE MAP</text>
  <text x="64" y="112" class="heading">A backend system, from request to execution</text>
  <text x="64" y="145" class="sub">Conceptual architecture for exploring API design, data access and asynchronous workloads</text>

  <!-- client -->
  <g filter="url(#shadow)">
    <rect x="62" y="270" width="220" height="150" rx="18" fill="#132A46" stroke="#367FB5" stroke-width="1.5"/>
    <rect x="82" y="291" width="42" height="34" rx="6" fill="#1B5C91"/>
    <path d="M89 318h28M103 325v5M95 330h16" stroke="#D8F5FF" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="365" class="boxTitle">Client</text>
    <text x="82" y="391" class="boxSub">Web / mobile app</text>
  </g>
  <!-- gateway -->
  <g filter="url(#shadow)">
    <rect x="365" y="270" width="230" height="150" rx="18" fill="url(#blue)" stroke="#4AABEF" stroke-width="1.5"/>
    <path d="M393 309h44M393 321h44M393 333h44" stroke="#A9E7FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="300" r="3" fill="#8DE6FF"/><circle cx="415" cy="300" r="3" fill="#8DE6FF"/><circle cx="430" cy="300" r="3" fill="#8DE6FF"/>
    <text x="393" y="365" class="boxTitle">API Gateway</text>
    <text x="393" y="391" class="boxSub">Nginx · routing · auth</text>
  </g>
  <!-- services -->
  <g filter="url(#shadow)">
    <rect x="690" y="195" width="255" height="145" rx="18" fill="url(#cyan)" stroke="#36B9D1" stroke-width="1.5"/>
    <circle cx="725" cy="231" r="15" fill="#1C8192" stroke="#8CEFFF" stroke-width="1.5"/>
    <path d="M718 231h14M725 224v14" stroke="#E2FCFF" stroke-width="2" stroke-linecap="round"/>
    <text x="718" y="286" class="boxTitle">Node.js Service</text>
    <text x="718" y="311" class="boxSub">Express · REST APIs</text>
    <rect x="690" y="390" width="255" height="145" rx="18" fill="url(#violet)" stroke="#7779D8" stroke-width="1.5"/>
    <circle cx="725" cy="426" r="15" fill="#4E4C9B" stroke="#B3B5FF" stroke-width="1.5"/>
    <path d="M717 426h16M725 418v16" stroke="#F0F0FF" stroke-width="2" stroke-linecap="round"/>
    <text x="718" y="481" class="boxTitle">Python Service</text>
    <text x="718" y="506" class="boxSub">FastAPI · validation</text>
  </g>
  <!-- data -->
  <g filter="url(#shadow)">
    <rect x="1080" y="160" width="290" height="125" rx="18" fill="#142C45" stroke="#4596D0" stroke-width="1.5"/>
    <ellipse cx="1120" cy="194" rx="20" ry="8" fill="#17649C" stroke="#8BD9FF" stroke-width="1.5"/>
    <path d="M1100 194v29c0 5 9 9 20 9s20-4 20-9v-29M1100 208c0 5 9 9 20 9s20-4 20-9" fill="none" stroke="#8BD9FF" stroke-width="1.5"/>
    <text x="1160" y="202" class="boxTitle">PostgreSQL</text>
    <text x="1160" y="230" class="boxSub">Relational data</text>
    <rect x="1080" y="315" width="290" height="125" rx="18" fill="#142C45" stroke="#4596D0" stroke-width="1.5"/>
    <path d="M1100 350h40v34h-40zM1108 342h24v8h-24zM1108 384h24v8h-24z" fill="#17649C" stroke="#8BD9FF" stroke-width="1.5"/>
    <text x="1160" y="357" class="boxTitle">MongoDB</text>
    <text x="1160" y="385" class="boxSub">Document data</text>
    <rect x="1080" y="470" width="290" height="125" rx="18" fill="#143747" stroke="#35A9B9" stroke-width="1.5"/>
    <path d="M1120 495c-13 0-22 9-22 20 0 9 6 16 15 18l7-4 7 4c9-2 15-9 15-18 0-11-9-20-22-20z" fill="#176E7D" stroke="#8CF3F4" stroke-width="1.5"/>
    <text x="1160" y="514" class="boxTitle">Redis</text>
    <text x="1160" y="542" class="boxSub">Cache · sessions · limits</text>
  </g>
  <!-- async lane -->
  <g filter="url(#shadow)">
    <rect x="365" y="555" width="230" height="105" rx="18" fill="#302B5B" stroke="#8784E8" stroke-width="1.5"/>
    <path d="M394 589h38v29h-38zM394 589l19 15 19-15" fill="none" stroke="#CFCEFF" stroke-width="2" stroke-linejoin="round"/>
    <text x="450" y="598" class="boxTitle">Message Queue</text>
    <text x="450" y="624" class="boxSub">RabbitMQ / Kafka</text>
    <rect x="690" y="555" width="255" height="105" rx="18" fill="#193A52" stroke="#4CA9CB" stroke-width="1.5"/>
    <path d="M718 588h34M718 599h34M718 610h34" stroke="#9BE9FF" stroke-width="3" stroke-linecap="round"/>
    <text x="770" y="598" class="boxTitle">Workers</text>
    <text x="770" y="624" class="boxSub">Background processing</text>
  </g>

  <path class="line" d="M282 345H355"/>
  <path class="line" d="M595 345H640V267H680"/>
  <path class="line" d="M640 345V463H680"/>
  <path class="line" d="M945 267H1010V222H1070"/>
  <path class="line" d="M945 267H1010V377H1070"/>
  <path class="line" d="M945 463H1010V532H1070"/>
  <path class="dash" d="M480 420V545"/>
  <path class="dash" d="M595 607H680"/>
  <text x="64" y="690" class="tag">DESIGN PRINCIPLES</text>
  <text x="270" y="690" class="sub">Clear boundaries  ·  Explicit data flow  ·  Async work where it helps  ·  Observable services</text>
</svg>
